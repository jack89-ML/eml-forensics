[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-forensics"
version = "0.2.0"
description = "Offline e-discovery toolkit for .eml corpora: MIME parsing, Markdown export, attachment hashing, OCR rotation grid, thread latency metrics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eml-forensics contributors" }]
keywords = [
  "forensics", "ediscovery", "email", "eml", "mime", "p7m", "cades",
  "ocr", "chain-of-custody", "graph", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.16", "Pillow>=10.0"]
dev = ["build>=1.2", "twine>=5.1"]

[project.scripts]
eml-forensics = "eml_forensics.cli:main"
emlf = "eml_forensics.cli:main"

[project.urls]
Homepage = "https://jack89-ml.github.io/#products"
Repository = "https://github.com/jack89-ML/eml-forensics"
Issues = "https://github.com/jack89-ML/eml-forensics/issues"
Changelog = "https://github.com/jack89-ML/eml-forensics/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "RET", "ARG", "S", "UP", "ISC", "PIE", "RUF"]
ignore = [
  "E501",    # line length: reviewed, not enforced mechanically
  "S101",    # asserts are the test framework here
  "S603",    # subprocess calls use fixed argv, never a shell
  "S607",    # openssl resolved through PATH on purpose
  "S110",    # try/except/pass around optional best-effort steps
  "ARG001",
  "ARG002",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM", "RUF059"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
omit = ["tests/*"]
fail_under = 80
