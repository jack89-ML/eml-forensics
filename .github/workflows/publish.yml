name: publish

# Publishes to PyPI on a version tag using PyPI Trusted Publishing (OIDC):
# no API token is stored in the repository.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI Project Name : eml-forensics
#   Owner             : jack89-ML
#   Repository name   : eml-forensics
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Release procedure:
#   git tag v0.1.0 && git push origin v0.1.0
#   then set the repository variable PYPI_PUBLISH=true to enable uploads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Skipped until the PyPI Trusted Publisher exists: set the repository
    # variable PYPI_PUBLISH to "true" once the one-time setup above is done.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
