name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check src tests
      - name: Run unit tests with coverage
        run: |
          python -m pip install --quiet "coverage[toml]"
          coverage run --source=src -m unittest discover -s tests -v
          coverage report

  package:
    # Verify the artefact users actually get: build sdist and wheel, check the
    # metadata, install the wheel into a clean environment and run the real
    # ingestion pipeline over a synthetic .eml corpus. Editable installs hide
    # packaging bugs; this job is the only place they surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/eml-forensics --version
          /tmp/clean/bin/emlf --help
      - name: End-to-end smoke test on a synthetic corpus
        run: |
          /tmp/clean/bin/python - <<'PY'
          import pathlib
          corpus = pathlib.Path("/tmp/corpus")
          corpus.mkdir(parents=True, exist_ok=True)
          corpus.joinpath("message.eml").write_text(
              "From: Alice <alice@example.com>\n"
              "To: Bob <bob@example.org>\n"
              "Subject: smoke test\n"
              "Date: Mon, 01 Sep 2026 10:00:00 +0000\n"
              "Message-ID: <smoke-1@example.com>\n"
              "MIME-Version: 1.0\n"
              "Content-Type: text/plain; charset=utf-8\n"
              "\n"
              "offline ingestion smoke test\n",
              encoding="utf-8")
          PY
          /tmp/clean/bin/emlf process --out /tmp/out /tmp/corpus
          test -n "$(find /tmp/out -name '*.md' -print -quit)"
          /tmp/clean/bin/emlf metrics --help > /dev/null
      - name: Verify stdout stays machine-readable (--json)
        run: |
          /tmp/clean/bin/emlf metrics --json /tmp/corpus > /tmp/payload.json
          /tmp/clean/bin/python -c "import json; d = json.load(open('/tmp/payload.json')); print('json ok, keys:', sorted(d)[:6]); assert d"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
